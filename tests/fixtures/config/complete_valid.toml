# Complete, well-formed mediadiff.toml exercising every recognized
# top-level section (doc 01 section 6). Referenced by
# tests/unit/test_toml_load.cpp -- the tolerance entry targets a check id
# ("video.color_range") not yet registered in src/core/checks.def
# deliberately, proving a forward-referencing glob is accepted (it is only
# validated syntactically, since it resolves to no check yet to unit-check
# against), while the severity entries target real production checks.
#
# The override block deliberately targets a DIFFERENT check
# (meta.missing_candidate) than the top-level [severity] section's
# meta.tool_version entry: 02-06-PLAN.md Task 3's own worked scenario reuses
# this exact fixture and asserts meta.tool_version's resolved chain is
# EXACTLY three entries (builtin, config, cli) -- a second config-layer
# write from an override block also matching meta.tool_version would add a
# fourth entry and break that assertion.

profile = "sw-encoder"

[severity]
"meta.tool_version" = "fail"
"meta.missing_candidate" = "warn"

[tolerance]
"video.color_range" = "3%"

[transform]
expect.resolution = "2x"

[dir]

[override."fixtures/**".severity]
"meta.missing_candidate" = "ignore"

[override."fixtures/**".tolerance]
"video.color_range" = "1%"
